function personMark(p,meal){return p.s[dk]?.[meal]||''}

function counts(meal,group){let a=state.people.filter(p=>!group||p.group===group),o={n:a.length,k:0,v:0,sh:0,vd:0};a.forEach(p=>{let v=personMark(p,meal);if(v==='К')o.k++;if(v==='В')o.v++;if(v==='Ш')o.sh++;if(v==='Вд')o.vd++});return o}

function demoStat(meal){let c=counts(meal);let base={breakfast:76,lunch:95,dinner:94}[meal],k={breakfast:27,lunch:5,dinner:6}[meal],vd={breakfast:23,lunch:23,dinner:18}[meal],v={breakfast:2,lunch:2,dinner:1}[meal],sh={breakfast:1,lunch:0,dinner:0}[meal];return {eat:base,k,vd,v,sh}}
function line(title,meal){let c=demoStat(meal),s=`${title} - ${c.eat}`;if(c.k)s+=` (${c.k}К${meal==='breakfast'?', з них 3 190+':''})`;let a=[];if(c.vd)a.push(`${c.vd} відрядження`);if(c.v)a.push(`${c.v} відпустка`);if(c.sh)a.push(`${c.sh} шпиталь`);if(a.length)s+=` (${a.join(', ')})`;return s}

function pageHead(title,sub,extra=''){return `<div class="page-head"><div class="page-title"><h1>${title}</h1><p>${sub}</p></div>${extra}</div>`}

  ${[['✎','green','Матола О.В.','С-43 · Обід · К','12:24'],['☑','green','Пивовар Д.М.','С-42 · Весь день · Вд','11:58'],['✎','orange','Коляда В.В.','С-44 · Сніданок · В','10:32'],['⚑','orange','Гончар І.В.','С-43 · Вечеря · Ш','09:17'],['↻','','Синхронізація','Дані успішно синхронізовано','08:45']].map(x=>`<div class="activity-row"><div class="act-ico ${x[1]}">${x[0]}</div><div><b>${x[2]}</b><p>${x[3]}</p></div><time>${x[4]}</time></div>`).join('')}

function status(){let people=state.people.filter(p=>p.group===activeGroup);let rows=people.map(p=>`<tr><td><div class="person">${p.name}</div><div class="sub">${p.rank}</div></td>${['breakfast','lunch','dinner'].map(m=>`<td><div class="mark ${markClass(personMark(p,m))}" onclick="openMark('${p.id}','${m}')">${personMark(p,m)||'—'}</div></td>`).join('')}<td>›</td></tr>`).join('');let mobile=people.map(p=>`<div class="mobile-person"><div class="avatar">${p.name[0]}</div><div><b>${p.name}</b><div class="sub">${p.rank}</div></div>${['breakfast','lunch','dinner'].map(m=>`<div class="mark ${markClass(personMark(p,m))}" onclick="openMark('${p.id}','${m}')">${personMark(p,m)||''}</div>`).join('')}<span>›</span></div>`).join('');return `${pageHead('Статуси','Проставлення К · В · Ш · Вд','<div class="date-chip">▣ <div><b>21.09.2026</b><div class="sub">Поточна дата</div></div></div>')}<div class="toolbar"><div class="seg">${groups.map(g=>`<button class="${g===activeGroup?'active':''}" onclick="activeGroup='${g}';render()">${g}</button>`).join('')}</div><div class="control searchbox">⌕ <input placeholder="Пошук по ПІБ..."></div><button class="btn secondary" onclick="toast('Масове проставлення відкрито')">☑ Масове проставлення</button><button class="btn secondary" onclick="toast('Режим: весь день')">▣ Весь день</button></div><div class="table-panel desktop-table"><table><thead><tr><th>ПІБ</th><th>Снід.</th><th>Обід</th><th>Веч.</th><th>Дії</th></tr></thead><tbody>${rows}</tbody></table></div><div class="panel mobile-cards">${mobile}</div>`}
