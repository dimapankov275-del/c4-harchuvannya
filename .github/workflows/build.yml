name: Build C4 Harchuvannya Installers

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        run: flutter create --platforms=android --org ua.c4 --project-name c4_harchuvannya .
      - name: Set Android app label
        run: sed -i 's/android:label="c4_harchuvannya"/android:label="С4 Харчування"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk C4_Harchuvannya_v0.8.0_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: C4-Harchuvannya-Android-APK
          path: C4_Harchuvannya_v0.8.0_Android.apk

  windows:
    name: Windows Setup EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --org ua.c4 --project-name c4_harchuvannya .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Setup.exe
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows\C4_Harchuvannya.iss"'
      - uses: actions/upload-artifact@v4
        with:
          name: C4-Harchuvannya-Windows-Setup
          path: installer/windows/output/C4_Harchuvannya_v0.8.0_Setup.exe

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate macOS runner
        run: flutter create --platforms=macos --org ua.c4 --project-name c4_harchuvannya .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build macos --release
      - name: Create DMG
        run: |
          mkdir dmgroot
          cp -R build/macos/Build/Products/Release/c4_harchuvannya.app dmgroot/'С4 Харчування.app'
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname 'С4 Харчування' -srcfolder dmgroot -ov -format UDZO C4_Harchuvannya_v0.8.0_macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: C4-Harchuvannya-macOS-DMG
          path: C4_Harchuvannya_v0.8.0_macOS.dmg
